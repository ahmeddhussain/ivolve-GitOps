name: Roadmap Microservice CI

on:
  workflow_dispatch: 
  push:
    branches: [ main ]
    paths:
      - 'docker/iVolveFinalProject/roadmap-service/**'
      - '.github/workflows/ci-roadmap.yml'

permissions:
  id-token: write
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::800770414458:role/GitHubActionsECRRole
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t 800770414458.dkr.ecr.us-east-1.amazonaws.com/ivolve-roadmap:${{ github.run_number }} docker/iVolveFinalProject/roadmap-service

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '800770414458.dkr.ecr.us-east-1.amazonaws.com/ivolve-roadmap:${{ github.run_number }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Push Docker Image to ECR
        run: |
          docker push 800770414458.dkr.ecr.us-east-1.amazonaws.com/ivolve-roadmap:${{ github.run_number }}

      - name: Update Kubernetes Manifest Tag
        run: |
          sed -i 's|image: .*|image: 800770414458.dkr.ecr.us-east-1.amazonaws.com/ivolve-roadmap:${{ github.run_number }}|g' k8s/roadmap-deploy-svc.yml

      - name: Commit and Push Updated Manifests (GitOps Trigger)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git commit -m "ci(roadmap): update image tag to ${{ github.run_number }}" || echo "No changes to commit"
          git push