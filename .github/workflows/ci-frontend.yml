name: Frontend Microservice CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'docker/iVolveFinalProject/frontend/**'
      - '.github/workflows/ci-frontend.yml'

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECRRole"
  ECR_REPO_NAME: "ivolve-frontend"
  MANIFEST_FILE: "k8s/frontend-deploy-svc.yml"
  DOCKER_BUILD_DIR: "docker/iVolveFinalProject/frontend"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag URI
        run: echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_URI }} ${{ env.DOCKER_BUILD_DIR }}

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_URI }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Push Docker Image to ECR
        run: docker push ${{ env.IMAGE_URI }}

      - name: Update Kubernetes Manifest Tag
        run: |
          sed -i "s|image: .*|image: ${{ env.IMAGE_URI }}|g" ${{ env.MANIFEST_FILE }}

      - name: Commit and Push Updated Manifests (GitOps Trigger)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.MANIFEST_FILE }}
          git commit -m "ci(${{ env.ECR_REPO_NAME }}): update image tag to ${{ github.run_number }}" || echo "No changes to commit"
          
          # Retry loop to handle concurrent GitOps pushes safely
          for i in {1..5}; do
            git pull --rebase origin main
            if git push; then
              echo " Successfully pushed to GitHub!"
              exit 0
            fi
            echo " Push failed due to concurrent update. Retrying in 5 seconds..."
            sleep 5
          done
          
          echo "❌ Failed to push after 5 attempts."
          exit 1